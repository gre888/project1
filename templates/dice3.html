<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  {% for person in persons%}
  <h2>{{ forloop.counter }}員工</h2>
  <ul>
    <li>姓名: {{ person.name }}</li>
    <li>電話: {{ person.phone }}</li>
    <li>年齡: {{ person.age }}</li>
  </ul>
  {% empty %}
  <h2>沒有員工資料</h2>
  {% endfor %}
</body>
</html>
